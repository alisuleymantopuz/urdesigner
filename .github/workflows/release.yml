name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version in all manifests
        run: |
          VERSION=${{ steps.version.outputs.version }}

          jq ".version = \"$VERSION\"" plugin.json > tmp.json && mv tmp.json plugin.json
          jq ".version = \"$VERSION\"" .cursor-plugin/plugin.json > tmp.json && mv tmp.json .cursor-plugin/plugin.json
          jq ".version = \"$VERSION\"" .codex-plugin/plugin.json > tmp.json && mv tmp.json .codex-plugin/plugin.json
          jq ".version = \"$VERSION\"" gemini-extension.json > tmp.json && mv tmp.json gemini-extension.json

          echo "All manifests updated to $VERSION."

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json .cursor-plugin/plugin.json .codex-plugin/plugin.json gemini-extension.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            **Claude Code**
            ```bash
            claude plugin install ./urdesigner
            ```

            **Gemini CLI**
            ```bash
            gemini extensions install ./urdesigner
            ```

            **Cursor / Codex** — install via each platform's plugin marketplace.
